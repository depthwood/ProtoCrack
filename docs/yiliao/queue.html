<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eef2" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("yiliao-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        else document.documentElement.setAttribute("data-theme", "light");
        var e = localStorage.getItem("yiliao-elderly");
        if (e === "1") document.documentElement.setAttribute("data-elderly", "true");
        else if (!document.documentElement.getAttribute("data-elderly"))
          document.documentElement.setAttribute("data-elderly", "false");
      } catch (err) {}
    })();
  </script>
  <title>医路伴行 · 排队</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <a class="app-brand" href="index.html">
      <span class="app-brand-icon" aria-hidden="true">✚</span>
      <span>医路伴行</span>
    </a>
    <div class="app-header-actions">
      <a class="header-link" href="dept.html">科室</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换浅色/深色模式" title="外观">☾</button>
      <span class="badge-soft" id="clock-now" aria-live="polite">--:--</span>
    </div>
  </header>

  <main>
    <div class="back-bar">
      <a href="journey.html">← 返回行程</a>
    </div>
    <h1 class="page-title">候诊排队</h1>
    <p class="page-sub">内科门诊 · 演示数据</p>

    <section class="card">
      <h2 class="card-title">当前叫号</h2>
      <p style="margin:0 0 8px;font-size:var(--font-size-hero);font-weight:700;">A078</p>
      <p class="list-meta">您的号码：<strong>A082</strong> · 前方 4 人</p>
      <p class="list-meta" style="margin-top:12px;">预计等待约 <strong>20 分钟</strong>（仅供参考）</p>
    </section>

    <section class="card">
      <h2 class="card-title">检查排队</h2>
      <ul class="list">
        <li class="list-item">
          <div>
            <strong>检验 · 抽血</strong>
            <div class="list-meta">预约 10:30 · 2 楼检验科</div>
          </div>
          <span class="tag tag-soon">已预约</span>
        </li>
        <li class="list-item">
          <div>
            <strong>影像 · 胸片（演示）</strong>
            <div class="list-meta">未预约 · 以开具单为准</div>
          </div>
          <span class="tag tag-wait">未开始</span>
        </li>
      </ul>
    </section>
  </main>

  <nav class="app-tabbar" aria-label="患者端主导航">
    <a class="tab-link" href="index.html">
      <span class="tab-icon" aria-hidden="true">⌂</span>
      首页
    </a>
    <a class="tab-link" href="journey.html" aria-current="page">
      <span class="tab-icon" aria-hidden="true">≡</span>
      行程
    </a>
    <a class="tab-link" href="reports.html">
      <span class="tab-icon" aria-hidden="true">▤</span>
      报告
    </a>
    <a class="tab-link" href="settings.html">
      <span class="tab-icon" aria-hidden="true">◆</span>
      我的
    </a>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
