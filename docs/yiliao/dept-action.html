<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eef2" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("yiliao-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        else document.documentElement.setAttribute("data-theme", "light");
        var e = localStorage.getItem("yiliao-elderly");
        if (e === "1") document.documentElement.setAttribute("data-elderly", "true");
        else if (!document.documentElement.getAttribute("data-elderly"))
          document.documentElement.setAttribute("data-elderly", "false");
      } catch (err) {}
    })();
  </script>
  <title>医路伴行 · 操作演示</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <a class="app-brand" href="dept.html">
      <span class="app-brand-icon" aria-hidden="true">⚕</span>
      <span>科室操作</span>
    </a>
    <div class="app-header-actions">
      <a class="header-link" href="index.html">患者端</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换浅色/深色模式" title="外观">☾</button>
      <span class="badge-soft" id="clock-now" aria-live="polite">--:--</span>
    </div>
  </header>

  <main>
    <div class="back-bar">
      <a href="dept-patient.html">← 返回患者详情</a>
    </div>
    <h1 class="page-title" id="action-title">操作演示</h1>
    <p class="page-sub" id="action-desc">加载中…</p>

    <section class="card">
      <h2 class="card-title">说明</h2>
      <p style="margin:0;line-height:1.65;">
        本页为静态原型占位，用于验证按钮跳转路径。正式系统将接入医嘱、病历与护理模块。
      </p>
      <div class="hero-actions" style="margin-top:16px;">
        <a class="btn-primary" href="dept-patient.html">完成并返回</a>
        <a class="btn-ghost" href="dept.html">回工作台</a>
      </div>
    </section>
  </main>

  <nav class="app-tabbar" aria-label="科室端导航">
    <a class="tab-link" href="dept.html">
      <span class="tab-icon" aria-hidden="true">▣</span>
      工作台
    </a>
    <a class="tab-link" href="dept-patient.html" aria-current="page">
      <span class="tab-icon" aria-hidden="true">👤</span>
      患者详情
    </a>
    <a class="tab-link" href="settings.html?role=dept">
      <span class="tab-icon" aria-hidden="true">◆</span>
      设置
    </a>
  </nav>

  <script>
    (function () {
      var map = {
        draft: {
          title: "病程草稿",
          desc: "（演示）草稿已暂存，可在病历编辑器中继续完善。",
        },
        order: {
          title: "开立医嘱",
          desc: "（演示）已进入医嘱录入流程占位页，正式系统将连接处方与合理用药模块。",
        },
        handoff: {
          title: "护理交接",
          desc: "（演示）交接条目已记录，交班护士将在工作台中确认签收。",
        },
      };
      var p = new URLSearchParams(window.location.search);
      var key = p.get("type") || "order";
      if (!map[key]) key = "order";
      var m = map[key];
      var ht = document.getElementById("action-title");
      var hd = document.getElementById("action-desc");
      if (ht) ht.textContent = m.title;
      if (hd) hd.textContent = m.desc;
      document.title = "医路伴行 · " + m.title;
    })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
