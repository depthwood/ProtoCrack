<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("saiwu-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <title>赛事设置 · 赛务通</title>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <header class="app-header">
    <a class="app-brand" href="index.html">
      <span class="app-brand-icon" aria-hidden="true">◈</span>
      <span>赛务通</span>
    </a>
    <div class="app-header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换浅色/深色模式" title="外观">☀</button>
      <span class="badge-live" id="clock-now" aria-live="polite">--:--:--</span>
    </div>
  </header>

  <main>
    <h1 class="page-title">赛事设置</h1>
    <p class="page-sub">基础信息、规则摘要与公告模板（原型表单）</p>

    <section class="card">
      <h2 class="card-title">赛事实体</h2>
      <div class="form-group">
        <label for="evt-name">赛事名称</label>
        <input id="evt-name" type="text" value="2026 春季田径公开赛" />
      </div>
      <div class="form-group">
        <label for="evt-venue">主场地</label>
        <input id="evt-venue" type="text" value="市体育中心 · 主体育场" />
      </div>
      <div class="form-group">
        <label for="evt-day">比赛日</label>
        <input id="evt-day" type="date" value="2026-05-12" />
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">竞赛规则摘要</h2>
      <div class="form-group">
        <label for="rules">对外显示（简短）</label>
        <textarea id="rules" rows="4" placeholder="风速、抢跑、道次抽签等摘要…">采用中国田径协会最新竞赛规则。若风速超过 +2.0 m/s，径赛成绩标注为超风速。</textarea>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">公告模板</h2>
      <ul class="list">
        <li class="list-item">
          <div>
            <strong>开场欢迎</strong>
            <div class="list-meta">观众入场后的标准播报</div>
          </div>
          <button type="button" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.8rem">编辑</button>
        </li>
        <li class="list-item">
          <div>
            <strong>安全提示</strong>
            <div class="list-meta">投掷项目与热身区安全</div>
          </div>
          <button type="button" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.8rem">编辑</button>
        </li>
        <li class="list-item">
          <div>
            <strong>颁奖流程</strong>
            <div class="list-meta">礼仪、合影留念顺序</div>
          </div>
          <button type="button" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.8rem">编辑</button>
        </li>
      </ul>
    </section>

    <section class="card">
      <h2 class="card-title">数据与同步（占位）</h2>
      <p class="page-sub" style="margin-bottom: 12px">以下为界面预留，不接真实接口。</p>
      <div class="row-actions">
        <button type="button" class="btn btn-ghost">导出本场配置 JSON</button>
        <button type="button" class="btn btn-ghost">从云端拉取</button>
      </div>
    </section>
  </main>

  <nav class="app-tabbar" aria-label="主导航">
    <a class="tab-link" href="index.html">
      <span class="tab-icon" aria-hidden="true">⌂</span>
      首页
    </a>
    <a class="tab-link" href="schedule.html">
      <span class="tab-icon" aria-hidden="true">▤</span>
      赛程
    </a>
    <a class="tab-link" href="checkin.html">
      <span class="tab-icon" aria-hidden="true">☑</span>
      检录
    </a>
    <a class="tab-link" href="live.html">
      <span class="tab-icon" aria-hidden="true">◎</span>
      现场
    </a>
    <a class="tab-link" href="settings.html" aria-current="page">
      <span class="tab-icon" aria-hidden="true">◆</span>
      设置
    </a>
  </nav>

  <script src="js/app.js"></script>
</body>

</html>
