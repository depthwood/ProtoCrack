<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>订单 · NX OTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-tab="orders" data-boot="orders">
  <div class="app">
    <header class="shell-header">
      <div>
        <h1 class="app-name">订单</h1>
        <div class="region">全部状态（本机演示）</div>
      </div>
      <a href="quotes.html" class="btn btn-ghost" style="padding:10px 14px;font-size:13px;text-decoration:none;">去交易</a>
    </header>

    <div class="filter-chips chip-group" role="tablist">
      <button type="button" class="chip on" data-filter="active">进行中</button>
      <button type="button" class="chip" data-filter="done">已完成</button>
      <button type="button" class="chip" data-filter="dispute">申诉/售后</button>
    </div>

    <div class="row-list" id="order-list-root">
      <p class="muted" style="padding:16px;">载入本地订单…</p>
    </div>
  </div>

  <nav class="bottom-tabs" aria-label="底部导航">
    <a href="index.html" data-tab="home">首页</a>
    <a href="quotes.html" data-tab="trade">交易</a>
    <a href="orders.html" data-tab="orders">订单</a>
    <a href="profile.html" data-tab="me">我的</a>
  </nav>
    <script src="assets/js/currency.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ai-intent.js"></script>
  <script src="assets/js/ai-hints.js"></script>
  <script src="assets/js/otc-ui.js"></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
