  <title>账户与交易安全 · NX OTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body class="flow-only">
  <div class="app flow-only">
    <header class="sub-top">
      <a class="back" href="profile.html" aria-label="返回">←</a>
      <h1 class="sub-title">安全</h1>
      <span class="sub-placeholder"></span>
    </header>

    <div class="card">
      <h2>防诈骗</h2>
      <p class="muted">付款前只认「订单页」里的收款信息；聊天工具里发来的卡号一律不要转账。</p>
    </div>

    <div class="card">
      <h2>交易风险提示</h2>
      <p class="muted">大额、异常设备或异地登录可能触发额外校验，这是为了保护账户资金安全。</p>
    </div>

    <div class="card">
      <h2>智能助手</h2>
      <p class="muted">助手可协助你找入口、解释页面，但不应代替你完成确认付款、签名等关键动作。</p>
    </div>

  </div>
  <script src="assets/js/app.js" defer></script>
