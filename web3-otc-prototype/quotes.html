<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>交易大厅 · NX OTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-tab="trade" data-boot="quotes">
  <div class="app">
    <header class="shell-header">
      <div>
        <h1 class="app-name">交易大厅</h1>
        <div class="region" data-shell-pair>USDT / CNY</div>
      </div>
      <a href="rfq.html" class="btn btn-ghost" style="padding:10px 14px;font-size:13px;text-decoration:none;">快捷金额</a>
    </header>

    <div class="filter-chips chip-group" id="quotes-chips" data-chip-app="1" role="tablist" aria-label="方向">
      <button type="button" class="chip on" data-side="buy">我要买</button>
      <button type="button" class="chip" data-side="sell">我要卖</button>
    </div>

    <p id="quotes-hint" class="muted" style="margin:-4px 0 12px;">载入报价…</p>

    <div class="row-list" id="quotes-list-root"></div>
  </div>

  <nav class="bottom-tabs" aria-label="底部导航">
    <a href="index.html" data-tab="home">首页</a>
    <a href="quotes.html" data-tab="trade">交易</a>
    <a href="orders.html" data-tab="orders">订单</a>
    <a href="profile.html" data-tab="me">我的</a>
  </nav>
    <script src="assets/js/currency.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ai-intent.js"></script>
  <script src="assets/js/ai-hints.js"></script>
  <script src="assets/js/otc-ui.js"></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
