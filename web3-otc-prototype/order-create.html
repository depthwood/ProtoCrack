<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>确认订单 · NX OTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />

<body class="flow-only" data-boot="create">
  <div class="app flow-only">
    <header class="sub-top">
      <a class="back" id="oc-back-q" href="quotes.html" aria-label="返回">←</a>
      <h1 class="sub-title">确认订单</h1>
      <span class="sub-placeholder"></span>
    </header>

    <div class="card">
      <table class="data" id="oc-table">
        <tbody>
          <tr><td colspan="2" class="muted">正在根据大厅选择生成订单…</td></tr>
        </tbody>
      </table>
      <p class="legal-strip">价格会随锁单倒计时变化；超时需重新下单。进入托管前需完成<strong>二次确认</strong>。</p>
      <div class="row-actions stack">
        <button type="button" class="btn btn-primary btn-block" id="btn-oc-confirm">确认信息并去托管签名</button>
        <a class="btn btn-outline btn-block" id="oc-back-list" href="quotes.html">返回重选</a>
      </div>
    </div>
  </div>
    <script src="assets/js/currency.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/confirm.js"></script>
  <script src="assets/js/ai-intent.js"></script>
  <script src="assets/js/ai-hints.js"></script>
