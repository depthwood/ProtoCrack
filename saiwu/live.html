<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("saiwu-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <title>现场控制 · 赛务通</title>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <header class="app-header">
    <a class="app-brand" href="index.html">
      <span class="app-brand-icon" aria-hidden="true">◈</span>
      <span>赛务通</span>
    </a>
    <div class="app-header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换浅色/深色模式" title="外观">☀</button>
      <span class="badge-live">LIVE</span>
      <span class="badge-live" id="clock-now" aria-live="polite">--:--:--</span>
    </div>
  </header>

  <main>
    <h1 class="page-title">现场控制</h1>
    <p class="page-sub">计时演示 · 播报文案 · 大屏联动入口</p>

    <section class="card live-panel">
      <h2 class="card-title">回合计时（演示）</h2>
      <div class="timer-display" id="timer-elapsed">00:00:00</div>
      <button type="button" class="btn btn-primary btn-block" id="timer-toggle">开始 / 继续</button>
    </section>

    <section class="card">
      <h2 class="card-title">播报字幕</h2>
      <div class="form-group">
        <label for="announce">口播 / 大屏文字</label>
        <textarea id="announce" rows="3" placeholder="例如：请男子 100m 预赛第三组运动员到检录处集合。"></textarea>
      </div>
      <div class="row-actions">
        <button type="button" class="btn btn-primary">推送至大屏</button>
        <button type="button" class="btn btn-ghost">仅本地预览</button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">快捷口令</h2>
      <ul class="list">
        <li class="list-item">
          <div>
            <strong>集合播报</strong>
            <div class="list-meta">统一模板，一键插入当前组别</div>
          </div>
          <button type="button" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.8rem">插入</button>
        </li>
        <li class="list-item">
          <div>
            <strong>道次确认</strong>
            <div class="list-meta">请运动员举手示意道次无误</div>
          </div>
          <button type="button" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.8rem">插入</button>
        </li>
        <li class="list-item">
          <div>
            <strong>成绩暂停</strong>
            <div class="list-meta">因设备校验，请稍候</div>
          </div>
          <button type="button" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.8rem">插入</button>
        </li>
      </ul>
    </section>

    <section class="card">
      <h2 class="card-title">相关页面</h2>
      <div class="row-actions">
        <a class="btn btn-ghost" href="schedule.html">返回赛程</a>
        <a class="btn btn-ghost" href="checkin.html">打开检录</a>
      </div>
    </section>
  </main>

  <nav class="app-tabbar" aria-label="主导航">
    <a class="tab-link" href="index.html">
      <span class="tab-icon" aria-hidden="true">⌂</span>
      首页
    </a>
    <a class="tab-link" href="schedule.html">
      <span class="tab-icon" aria-hidden="true">▤</span>
      赛程
    </a>
    <a class="tab-link" href="checkin.html">
      <span class="tab-icon" aria-hidden="true">☑</span>
      检录
    </a>
    <a class="tab-link" href="live.html" aria-current="page">
      <span class="tab-icon" aria-hidden="true">◎</span>
      现场
    </a>
    <a class="tab-link" href="settings.html">
      <span class="tab-icon" aria-hidden="true">◆</span>
      设置
    </a>
  </nav>

  <script src="js/app.js"></script>
</body>

</html>
