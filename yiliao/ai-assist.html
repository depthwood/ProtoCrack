<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eef2" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("yiliao-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        else document.documentElement.setAttribute("data-theme", "light");
        var e = localStorage.getItem("yiliao-elderly");
        if (e === "1") document.documentElement.setAttribute("data-elderly", "true");
        else if (!document.documentElement.getAttribute("data-elderly"))
          document.documentElement.setAttribute("data-elderly", "false");
      } catch (err) {}
    })();
  </script>
  <title>医路伴行 · 智能助理</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <a class="app-brand" href="index.html">
      <span class="app-brand-icon" aria-hidden="true">✚</span>
      <span>医路伴行</span>
    </a>
    <div class="app-header-actions">
      <a class="header-link" href="dept.html">科室</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换浅色/深色模式" title="外观">☾</button>
      <span class="badge-soft" id="clock-now" aria-live="polite">--:--</span>
    </div>
  </header>

  <main>
    <div class="back-bar">
      <a href="index.html">← 返回首页</a>
    </div>
    <h1 class="page-title">智能助理</h1>
    <p class="page-sub">演示对话 · 连接真实 AI 前请完成合规与免责评审</p>

    <div class="ai-banner" role="note">
      <strong>重要说明：</strong>本功能仅辅助理解就诊流程与健康宣教，<strong>不能替代医生诊断或用药建议</strong>。紧急情况请拨打急救电话或至急诊。
    </div>

    <section class="card">
      <div class="ai-chat" aria-live="polite">
        <div class="bubble bubble--ai">
          您好，我可以帮您用通俗语言说明「接下来要做什么」，或解释报告里的常用词。请直接输入问题。
        </div>
        <div class="bubble bubble--user">我前面还有几个人？</div>
        <div class="bubble bubble--ai">
          （演示）您当前在内科候诊，前方约 4 人。请到 3 楼候诊区留意屏幕叫号；若有不适可告知护士台。
        </div>
      </div>
      <div class="chat-input-row">
        <label class="visually-hidden" for="ai-input">输入问题</label>
        <input class="chat-input" id="ai-input" type="text" placeholder="例如：血小板低是什么意思？" autocomplete="off" />
        <button type="button" class="btn-primary" id="ai-send-btn" style="padding:0 18px;" disabled aria-disabled="true">发送</button>
      </div>
    </section>
  </main>

  <nav class="app-tabbar" aria-label="患者端主导航">
    <a class="tab-link" href="index.html">
      <span class="tab-icon" aria-hidden="true">⌂</span>
      首页
    </a>
    <a class="tab-link" href="journey.html">
      <span class="tab-icon" aria-hidden="true">≡</span>
      行程
    </a>
    <a class="tab-link" href="reports.html">
      <span class="tab-icon" aria-hidden="true">▤</span>
      报告
    </a>
    <a class="tab-link" href="settings.html">
      <span class="tab-icon" aria-hidden="true">◆</span>
      我的
    </a>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
